services:
  postgres:
    image: postgres:16-alpine
    container_name: retiro-db
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: retiro
      POSTGRES_PASSWORD: retiro123
      POSTGRES_DB: retiro_db
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
